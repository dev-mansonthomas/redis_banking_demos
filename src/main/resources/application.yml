spring:
  application:
    name: redis-banking-workshop

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  mvc:
    async:
      request-timeout: -1

server:
  port: 8080

# Dev-mode logs land in logs/app.log so scripts/dump-logs.sh can collect them.
# In Docker the same output is still available via `docker compose logs app`.
logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  timeout:
    connect: 10s
    chat: 30s
    stream: 60s

workshop:
  startup:
    load-data: true
    force-reload: false
  ams:
    base-url: ${WORKSHOP_AMS_BASE_URL:http://localhost:8000}
    mcp-url: ${WORKSHOP_AMS_MCP_URL:http://localhost:9000}
    default-namespace: workshop
