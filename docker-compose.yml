services:
  redis:
    image: redis:latest
    container_name: workshop-redis
    ports:
      - "6379:6379"
    # Workshop data is disposable: the app reloads every dataset and index at
    # startup (and on /api/reset-all). Persistence is therefore switched off —
    # no RDB snapshot, no AOF — which also removes the MISCONF failure mode
    # where a full disk makes BGSAVE fail and Redis rejects every write.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent-memory-server:
    image: redislabs/agent-memory-server:latest
    container_name: workshop-ams
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DISABLE_AUTH=true
      - LONG_TERM_MEMORY=true
      - ENABLE_DISCRETE_MEMORY_EXTRACTION=true
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # Ensure the long-term memory `memory_records` index exists before the API
    # starts serving requests. Without it, /v1/long-term-memory/search and
    # /v1/memory/prompt can fail with "No such index memory_records" and UC14
    # seed traces surface as AMS unreachable. `rebuild-index` is
    # non-destructive for stored memory hashes (FT.CREATE auto-indexes matching
    # `memory_idx:*` keys), so we run it on every container start.
    command: ["sh", "-c", "agent-memory rebuild-index && exec agent-memory api --host 0.0.0.0 --port 8000 --task-backend asyncio"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2).read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent-memory-server-mcp:
    image: redislabs/agent-memory-server:latest
    container_name: workshop-ams-mcp
    profiles:
      - ams-mcp
      - workshop
    ports:
      - "9000:9000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DISABLE_AUTH=true
      - LONG_TERM_MEMORY=true
      - ENABLE_DISCRETE_MEMORY_EXTRACTION=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # Keep parity with the REST service: ensure the long-term memory index
    # exists before the MCP server starts serving tool calls.
    command: ["sh", "-c", "agent-memory rebuild-index && exec agent-memory mcp --mode streamable-http --port 9000 --task-backend asyncio"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.create_connection(('localhost', 9000), 2); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  workshop-app:
    build: .
    container_name: workshop-app
    profiles:
      - workshop
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - SPRING_DATA_REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WORKSHOP_AMS_BASE_URL=http://agent-memory-server:8000
      - WORKSHOP_AMS_MCP_URL=http://agent-memory-server-mcp:9000
    depends_on:
      redis:
        condition: service_healthy
      agent-memory-server:
        condition: service_healthy
      agent-memory-server-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: workshop-redis-insight
    environment:
      - RI_APP_PORT=8001
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=Workshop Redis
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
